name: iOS Build (kiem tra build tren may Mac ao)
on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cai dat + build web + dong bo Capacitor (kem pod install)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Build iOS Simulator bang Xcode
        working-directory: frontend/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Tai ban build len (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: strangerchat-ios-simulator
          path: ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/App.app
