<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Học từ vựng tiếng Anh</title>
    <style>
      :root {
        --bg: #141a21;
        --panel: #1e2733;
        --panel-2: #232f3f;
        --raise: #1b232e;
        --line: #303d4e;
        --line-soft: #283444;
        --text: #e8edf4;
        --muted: #97a5b6;
        --blue: #58a6ff;
        --blue-dark: #1f6feb;
        --green: #3fb950;
        --green-soft: rgba(63, 185, 80, 0.14);
        --red: #f47067;
        --red-soft: rgba(244, 112, 103, 0.13);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      button { font: inherit; cursor: pointer; }
      .hidden { display: none !important; }

      .quiz {
        width: 100%;
        max-width: 640px;
        padding: 28px 18px 40px;
      }
      .status {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 15px;
        margin-bottom: 10px;
      }
      .status b { color: var(--text); }
      .bar {
        height: 6px;
        background: var(--line-soft);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 22px;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--blue);
        border-radius: 3px;
        transition: width 0.25s;
      }

      /* ---------- 1 question box ---------- */
      .q-box {
        background: var(--panel);
        border: 2px solid var(--blue-dark);
        border-radius: 14px;
        padding: 30px 24px 34px;
        text-align: center;
        margin-bottom: 16px;
      }
      .q-label {
        display: block;
        color: var(--muted);
        font-size: 14.5px;
        margin-bottom: 10px;
      }
      .q-word {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.3;
        overflow-wrap: break-word;
      }

      /* ---------- 4 answer boxes ---------- */
      .opts { display: grid; gap: 10px; }
      .opt {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        background: var(--panel);
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
        color: var(--text);
        font-size: 18px;
      }
      .opt:hover:not(:disabled) { border-color: var(--blue); background: var(--panel-2); }
      .opt .letter {
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1.5px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 15px;
        color: var(--muted);
      }
      .opt.correct { border-color: var(--green); background: var(--green-soft); }
      .opt.correct .letter { background: var(--green); border-color: var(--green); color: #fff; }
      .opt.wrong { border-color: var(--red); background: var(--red-soft); }
      .opt.wrong .letter { background: var(--red); border-color: var(--red); color: #fff; }
      .opt.dim { opacity: 0.55; }
      .opt:disabled { cursor: default; }

      .feedback {
        min-height: 1.5em;
        font-size: 16.5px;
        margin: 16px 2px 0;
      }
      .feedback.ok { color: var(--green); font-weight: 650; }
      .feedback.bad { color: var(--red); font-weight: 650; }

      .next-btn {
        margin-top: 16px;
        width: 100%;
        background: var(--green);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 15px 20px;
        font-size: 17px;
        font-weight: 700;
      }
      .next-btn:hover { filter: brightness(1.08); }

      /* ---------- summary ---------- */
      .summary {
        background: var(--panel);
        border: 1px solid var(--line-soft);
        border-radius: 14px;
        padding: 36px 24px;
        text-align: center;
      }
      .summary h2 { margin: 0 0 8px; font-size: 30px; }
      .summary p { color: var(--muted); margin: 0 0 22px; }
      .again-btn {
        background: var(--blue-dark);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 14px 30px;
        font-size: 17px;
        font-weight: 700;
      }
      .again-btn:hover { background: #2a78f6; }

      @media (max-width: 560px) {
        .quiz { padding-top: 20px; }
        .q-word { font-size: 26px; }
        .opt { font-size: 16.5px; padding: 14px 15px; }
      }
    </style>
  </head>
  <body>
    <main class="quiz">
      <div id="quizMain">
        <div class="status">
          <span id="quizCount">Câu 1 / 10</span>
          <span id="quizScore">Điểm: 0</span>
        </div>
        <div class="bar"><i id="quizBarFill"></i></div>

        <div class="q-box">
          <span class="q-label">Từ này trong tiếng Anh là gì?</span>
          <div class="q-word" id="quizWord"></div>
        </div>

        <div class="opts" id="quizOpts"></div>

        <p class="feedback" id="quizFeedback" aria-live="polite"></p>
        <button class="next-btn hidden" id="quizNextBtn" type="button">Câu tiếp theo</button>
      </div>

      <div id="quizSummary" class="hidden"></div>
    </main>

    <script>
      // 29 từ vựng từ phần Key vocabulary của 4 bài nghe cũ
      var WORDS = [
        { en: "out of the office", vi: "vắng mặt tại văn phòng" },
        { en: "limited access", vi: "quyền truy cập hạn chế" },
        { en: "urgent", vi: "khẩn cấp" },
        { en: "assistant", vi: "trợ lý" },
        { en: "sales department", vi: "phòng kinh doanh" },
        { en: "get back to you", vi: "phản hồi lại cho bạn" },
        { en: "look forward to", vi: "mong đợi, trông chờ" },
        { en: "annual", vi: "thường niên, hằng năm" },
        { en: "be held", vi: "được tổ chức" },
        { en: "provide", vi: "cung cấp" },
        { en: "sunscreen", vi: "kem chống nắng" },
        { en: "sign up", vi: "đăng ký" },
        { en: "front desk", vi: "quầy lễ tân" },
        { en: "in case of", vi: "trong trường hợp" },
        { en: "outdoors", vi: "ngoài trời" },
        { en: "patience", vi: "sự kiên nhẫn" },
        { en: "be delayed", vi: "bị hoãn, bị trễ" },
        { en: "departure", vi: "sự khởi hành" },
        { en: "meal voucher", vi: "phiếu ăn" },
        { en: "connecting flight", vi: "chuyến bay nối chuyến" },
        { en: "rebook", vi: "đặt lại (vé)" },
        { en: "apologize", vi: "xin lỗi" },
        { en: "inconvenience", vi: "sự bất tiện" },
        { en: "get in shape", vi: "lấy lại vóc dáng" },
        { en: "downtown", vi: "trung tâm thành phố" },
        { en: "equipment", vi: "thiết bị, dụng cụ" },
        { en: "enrollment fee", vi: "phí ghi danh" },
        { en: "session", vi: "buổi (tập, học)" },
        { en: "coach", vi: "huấn luyện viên" }
      ];
      var ROUND = 10;

      var $ = function (id) { return document.getElementById(id); };

      function shuffleArr(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
      function esc(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      var quiz = null; // { questions: [{item, options}], i, score, answered }

      function startQuiz() {
        var questions = shuffleArr(WORDS).slice(0, Math.min(ROUND, WORDS.length)).map(function (item) {
          var others = shuffleArr(WORDS.filter(function (p) { return p.en !== item.en; })).slice(0, 3);
          return { item: item, options: shuffleArr([item].concat(others)) };
        });
        quiz = { questions: questions, i: 0, score: 0, answered: false };
        $("quizSummary").classList.add("hidden");
        $("quizMain").classList.remove("hidden");
        renderQuestion();
      }

      function renderQuestion() {
        var q = quiz.questions[quiz.i];
        quiz.answered = false;
        $("quizCount").innerHTML = "Câu <b>" + (quiz.i + 1) + " / " + quiz.questions.length + "</b>";
        $("quizScore").innerHTML = "Điểm: <b>" + quiz.score + "</b>";
        $("quizBarFill").style.width = Math.round(quiz.i / quiz.questions.length * 100) + "%";
        $("quizWord").textContent = q.item.vi;
        var fb = $("quizFeedback");
        fb.textContent = "";
        fb.className = "feedback";
        $("quizNextBtn").classList.add("hidden");
        var box = $("quizOpts");
        box.innerHTML = "";
        var letters = ["A", "B", "C", "D"];
        q.options.forEach(function (opt, k) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "opt";
          b.innerHTML = '<span class="letter">' + letters[k] + '</span><span>' + esc(opt.en) + "</span>";
          b.addEventListener("click", function () { answer(b, opt); });
          box.appendChild(b);
        });
      }

      function answer(btn, opt) {
        if (!quiz || quiz.answered) return;
        quiz.answered = true;
        var q = quiz.questions[quiz.i];
        var correct = opt.en === q.item.en;
        var buttons = $("quizOpts").children;
        for (var k = 0; k < buttons.length; k++) {
          buttons[k].disabled = true;
          if (q.options[k].en === q.item.en) buttons[k].classList.add("correct");
          else if (buttons[k] === btn) buttons[k].classList.add("wrong");
          else buttons[k].classList.add("dim");
        }
        var fb = $("quizFeedback");
        if (correct) {
          quiz.score++;
          fb.className = "feedback ok";
          fb.textContent = "Đúng rồi! “" + q.item.en + "” = " + q.item.vi + ".";
        } else {
          fb.className = "feedback bad";
          fb.textContent = "Chưa đúng. Đáp án đúng là “" + q.item.en + "”.";
        }
        $("quizScore").innerHTML = "Điểm: <b>" + quiz.score + "</b>";
        $("quizBarFill").style.width = Math.round((quiz.i + 1) / quiz.questions.length * 100) + "%";
        var nb = $("quizNextBtn");
        nb.textContent = quiz.i === quiz.questions.length - 1 ? "Xem kết quả" : "Câu tiếp theo";
        nb.classList.remove("hidden");
        nb.focus();
      }

      function next() {
        if (!quiz) return;
        if (quiz.i < quiz.questions.length - 1) {
          quiz.i++;
          renderQuestion();
        } else {
          showSummary();
        }
      }

      function showSummary() {
        $("quizMain").classList.add("hidden");
        var box = $("quizSummary");
        box.classList.remove("hidden");
        var total = quiz.questions.length;
        var msg = quiz.score === total
          ? "Xuất sắc — bạn trả lời đúng hết các từ trong lượt này!"
          : quiz.score >= Math.ceil(total * 0.7)
            ? "Tốt lắm — ôn lại mấy từ vừa sai là thuộc hết."
            : "Cố lên — làm lại một lượt nữa sẽ nhớ lâu hơn.";
        box.innerHTML =
          '<div class="summary">' +
          "<h2>" + quiz.score + " / " + total + " câu đúng</h2>" +
          "<p>" + msg + "</p>" +
          '<button class="again-btn" id="againBtn" type="button">Làm lượt mới</button>' +
          "</div>";
        $("againBtn").addEventListener("click", startQuiz);
        $("againBtn").focus();
      }

      $("quizNextBtn").addEventListener("click", next);
      startQuiz();
    </script>
  </body>
</html>
